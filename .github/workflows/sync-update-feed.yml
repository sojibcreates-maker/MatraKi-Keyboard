name: Sync Update Feed on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update docs/updates.json from latest release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REL_NAME: ${{ github.event.release.name }}
          REL_URL: ${{ github.event.release.html_url }}
        run: |
          python3 - << 'EOF'
          import json, os, re

          path = "docs/updates.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          tag = os.environ.get("TAG_NAME", "").strip()
          ver = re.sub(r"^[vV]", "", tag) if tag else data.get("latest_version", "1.0.0")
          title = os.environ.get("REL_NAME", "").strip() or f"MatraKi v{ver}"
          rel_url = os.environ.get("REL_URL", "").strip() or "https://github.com/sojibcreates-maker/MatraKi-Keyboard/releases/latest"

          data["latest_version"] = ver
          data["release_title"] = title
          data["github_release_url"] = rel_url
          for k in ("linux", "windows", "osx"):
              if k in data.get("updates", {}):
                  data["updates"][k]["latest-version"] = ver
                  data["updates"][k]["download-url"] = rel_url

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/updates.json
          git diff --cached --quiet || (git commit -m "chore(release): auto-update docs/updates.json for new release" && git push origin main)
